[whatsapp]
group_name = Gruppe 8a
command = /KA
add_command = /addKA
del_command = /delKA
response_file = ka_response.txt
ka_list_file = ka_list.txt
poll_interval_seconds = 0.5
# These names are not allowed to use /addKA. Everyone else is allowed.
# Names exactly as shown in WhatsApp, separated by commas.
blocked_add_names =

[browser]
# Leave empty to let Selenium find Chrome/Chromium automatically.
binary_location =
# On Raspberry Pi this is often /usr/bin/chromedriver after installing chromium-chromedriver.
driver_path =
# On Raspberry Pi this keeps your WhatsApp login saved between restarts.
profile_directory = whatsapp-profile
headless = false
# false = only react to messages from other group members.
include_own_messages = false
